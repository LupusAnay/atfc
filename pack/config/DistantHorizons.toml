# Auto-TFC DH internal-server distant-generation baseline.
# This is the default DH mode for the pinned 3.2.0-b build.
_version = 4

[common.worldGenerator]
enableDistantGeneration = true
distantGeneratorMode = "INTERNAL_SERVER"

[server]
enableServerGeneration = true
enableRealTimeUpdates = true
synchronizeOnLoad = true
